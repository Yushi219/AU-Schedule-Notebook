<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>AU 2026 · Schedule Notebook</title>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--panel2:#14171e;--line:#2a2e37;--txt:#e8eaed;--muted:#9aa0ab;--gold:#f5c518;--blue:#4f9dff;--green:#3ecf8e;--red:#ff6b6b;--purple:#c3aaff;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
#app{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
a{color:var(--blue);}
button{font-family:inherit;}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:18px;cursor:pointer;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--blue);color:var(--blue);}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#0b1220;font-weight:600;}
.btn.primary:hover{color:#000;filter:brightness(1.1);}
.btn.danger{border-color:#6b2a2a;color:var(--red);}
.btn.rec{background:#3a1c1c;border-color:var(--red);color:#ffb3b3;}
.btn.rec.on{background:var(--red);color:#fff;animation:pulse 1.4s infinite;}
.btn.sm{padding:3px 9px;font-size:11px;}
.btn:disabled{opacity:.45;cursor:default;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.6);}70%{box-shadow:0 0 0 10px rgba(255,107,107,0);}100%{box-shadow:0 0 0 0 rgba(255,107,107,0);}}
input,textarea,select{font-family:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;}
input:focus,textarea:focus{border-color:var(--blue);}
textarea{width:100%;resize:vertical;line-height:1.55;}
.muted{color:var(--muted);}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap;}
.t-full{background:#5a2020;color:#ff9d9d;}.t-dup{background:#4a3d18;color:#ffd86b;}.t-unique{background:#173d33;color:#5fe0ad;}
.t-backup{background:#3d3320;color:#ffce7a;}.t-strat{background:#2a2350;color:#c3aaff;}.t-lab{background:#173650;color:#7cc0ff;}.t-short{background:#333;color:#bbb;}.t-add{background:#2b3140;color:#aab6d0;}.t-note{background:#1f3a2c;color:#8fe3b5;}

/* ===== header ===== */
header{padding:10px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;}
header .hl{flex:1 1 300px;min-width:0;}
header h1{margin:0 0 3px;font-size:17px;}
header p{margin:0;color:var(--muted);font-size:12px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:11.5px;color:var(--muted);align-items:center;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--line);}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto;}
.search{position:relative;flex:1 1 260px;max-width:460px;min-width:200px;}
.search input{width:100%;border-radius:20px;padding:8px 14px;}
.search .dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow:auto;z-index:120;box-shadow:0 12px 40px rgba(0,0,0,.6);display:none;}
.search .dd.on{display:block;}
.search .it{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
.search .it:hover,.search .it.sel{background:#232732;}
.search .it .c{color:var(--muted);font-size:10.5px;letter-spacing:.4px;min-width:60px;}
.search .it .t{font-weight:600;font-size:12.5px;line-height:1.3;}
.search .it .m{color:var(--muted);font-size:11px;margin-top:2px;}
.search .it .in{color:var(--green);font-size:10px;margin-left:auto;white-space:nowrap;}

/* ===== calendar grid (desktop) ===== */
.scroller{flex:1 1 auto;overflow:auto;position:relative;}
.gridwrap{position:relative;min-width:1500px;min-height:100%;}
.daynames{display:grid;position:sticky;top:0;background:var(--bg);z-index:40;border-bottom:2px solid var(--line);}
.daynames .cell{padding:9px 14px;font-weight:700;font-size:14px;border-right:1px solid var(--line);}
.daynames .cell small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px;}
.tg{position:relative;}
.axis-tk{border-top:1px solid var(--line);border-right:1px solid var(--line);padding:2px 6px 0;color:var(--muted);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;}
.axis-tk.major{color:#c7cbd2;font-weight:600;}
.sub{display:grid;gap:4px;padding:2px 4px;border-right:1px solid var(--line);}
.sess{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:7px;padding:5px 8px;cursor:pointer;transition:box-shadow .12s;background:#232732;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;overflow:auto;margin:1px 0;}
.sess:hover{box-shadow:0 6px 20px rgba(0,0,0,.6);border-color:var(--blue);z-index:30;}
.sess.p1{border-left-color:var(--green);}.sess.p2{border-left-color:var(--gold);}.sess.p3{border-left-color:var(--muted);}
.sess.full{background:#3a2626;border-left-color:var(--red);}
.sess.added{border-left-color:#8fa3c9;background:#20252e;}
.sess.dim{opacity:.24;}
.sess.hi{box-shadow:0 0 0 2px var(--gold),0 6px 20px rgba(0,0,0,.6);z-index:29;}
.rank{position:absolute;top:6px;right:7px;font-size:9px;font-weight:700;color:#0f1115;background:var(--green);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;}
.sess.p2 .rank{background:var(--gold);}.sess.p3 .rank{background:var(--muted);}.sess.full .rank{background:var(--red);color:#fff;}.sess.added .rank{background:#8fa3c9;}
.code{font-size:9.5px;color:var(--muted);letter-spacing:.4px;}
.title{font-size:11.5px;font-weight:600;line-height:1.22;padding-right:16px;}
.time{font-size:10px;color:var(--muted);}
.stars{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:3px;}
.srow{font-size:9.5px;color:var(--muted);display:inline-flex;align-items:center;gap:3px;}
.srow b{color:#c7cbd2;font-weight:500;}
.dots{color:var(--gold);font-size:10px;letter-spacing:.5px;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.sess.mini{gap:1px;padding:4px 8px;}
.sess.mini .stars{display:none;}
.sess.mini .title{font-size:11px;}
svg.ribbons{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25;}
.notebadge{font-size:9.5px;color:#8fe3b5;display:inline-flex;gap:5px;}

/* ===== mobile list ===== */
.mlist{display:none;flex:1 1 auto;overflow:auto;}
.daytabs{display:flex;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5;}
.daytabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 4px;font-size:13px;font-weight:600;}
.daytabs button.on{color:var(--txt);border-bottom-color:var(--gold);}
.mday{padding:10px 12px 40px;display:flex;flex-direction:column;gap:8px;}
.mcard{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:9px 12px;background:#232732;}
.mcard.p1{border-left-color:var(--green);}.mcard.p2{border-left-color:var(--gold);}.mcard.p3{border-left-color:var(--muted);}.mcard.full{border-left-color:var(--red);background:#3a2626;}.mcard.added{border-left-color:#8fa3c9;}
.mcard .title{font-size:13.5px;padding-right:0;}
.mcard .time{font-size:11.5px;margin:2px 0 4px;}
.mcard .row{display:flex;gap:6px;align-items:center;margin-top:6px;}
.mgap{color:var(--muted);font-size:11px;padding:2px 6px;}

/* ===== modal ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
.overlay.on{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;}
.modal h2{margin:0 0 4px;font-size:18px;line-height:1.35;}
.m-code{color:var(--muted);font-size:12px;letter-spacing:.5px;}
.m-meta{margin:10px 0;color:#c7cbd2;font-size:12.5px;line-height:1.6;}
.m-tags{margin:8px 0 14px;display:flex;flex-wrap:wrap;gap:6px;}
.rate-box{background:#14171e;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;display:flex;gap:26px;}
.rate-box .srow{font-size:13px;}.rate-box .dots{font-size:15px;}
.m-note{background:#1d2a24;border-left:3px solid var(--green);padding:10px 13px;border-radius:6px;font-size:12.5px;line-height:1.55;margin:12px 0;}
.m-note.dup{background:#2a2718;border-left-color:var(--gold);}.m-note.full{background:#2e1e1e;border-left-color:var(--red);}
.sec-h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 6px;}
.m-desc{color:#c7cbd2;font-size:12.5px;line-height:1.65;white-space:pre-wrap;}
.m-spk{color:#d7dae0;font-size:12px;margin-top:4px;line-height:1.7;}
.close{float:right;cursor:pointer;color:var(--muted);font-size:24px;line-height:1;margin:-6px -6px 0 0;}
.close:hover{color:#fff;}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;}
.field{margin:10px 0;}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.field input{width:100%;}
.field small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5;}

/* ===== record page ===== */
.rec{display:flex;flex-direction:column;height:100%;flex:1 1 auto;min-height:0;}
.rec-head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.rec-head .ttl{flex:1 1 200px;min-width:0;}
.rec-head .ttl b{display:block;font-size:14px;line-height:1.3;}
.rec-head .ttl span{color:var(--muted);font-size:11px;}
.rec-head .timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:56px;}
.sync{font-size:11px;color:var(--muted);white-space:nowrap;}
.micst{display:none;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap;max-width:260px;}
.micst.on{display:inline-flex;}
.micst .lvl{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;flex:none;}
.micst .lvl b{display:block;height:100%;width:0;background:var(--green);transition:width .08s linear;}
.micst.warn .lvl b{background:var(--gold);}.micst.err .lvl b{background:var(--red);}
.micst.warn{color:var(--gold);}.micst.err{color:var(--red);}
.micst span{overflow:hidden;text-overflow:ellipsis;}
.sync.ok{color:var(--green);}.sync.err{color:var(--red);}.sync.busy{color:var(--gold);}
.rec-body{display:flex;flex:1 1 auto;min-height:0;}
.pane{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;min-height:0;}
.pane.notes{border-right:1px solid var(--line);flex-basis:46%;}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel2);}
.pane-h b{font-size:12.5px;}
.pane-b{flex:1 1 auto;overflow:auto;padding:12px;}
.tabbar{display:none;border-bottom:1px solid var(--line);}
.tabbar button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px;font-size:13px;font-weight:600;}
.tabbar button.on{color:var(--txt);border-bottom-color:var(--blue);}
.seg{padding:6px 8px;border-radius:8px;margin-bottom:4px;position:relative;}
.seg:hover{background:#1c2029;}
.seg .en{font-size:14px;line-height:1.5;}
.seg .zh{font-size:12.5px;line-height:1.5;color:#8b919c;margin-top:2px;}
.seg .zh.pending{color:#5a606a;font-style:italic;}
.seg .at{font-size:10px;color:#5a606a;margin-right:6px;font-variant-numeric:tabular-nums;}
.seg.star{background:#2a2718;}
.seg.manual .en{color:#cfe2ff;}
.seg .ops{position:absolute;right:6px;top:4px;display:none;gap:4px;}
.seg:hover .ops{display:flex;}
.seg .ops button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:6px;font-size:11px;padding:1px 6px;cursor:pointer;}
.interim{color:#6f7682;font-style:italic;padding:6px 8px;font-size:14px;min-height:20px;}
.manual-in{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel2);}
.manual-in input{flex:1;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.card h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card h3 .sp{flex:1;}
.summ .kw{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.summ .kw span{background:#1f2633;border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;color:#b9c3d6;}
.summ .li{padding:5px 0;border-bottom:1px dashed #262a33;}
.summ .li .en{font-size:13px;line-height:1.45;}
.summ .li .zh{font-size:12px;color:#8b919c;line-height:1.45;}
.summ h4{margin:10px 0 4px;font-size:12px;color:var(--gold);}
.md{font-size:13px;line-height:1.6;}
.md h1,.md h2,.md h3{font-size:14px;margin:12px 0 6px;color:var(--gold);}
.md h1{font-size:16px;}
.md ul{padding-left:20px;margin:4px 0;}
.md p{margin:6px 0;}
.md code{background:#0f1115;padding:0 4px;border-radius:4px;}
.res{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #262a33;}
.res a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;}
.res input{flex:1;font-size:12px;padding:3px 6px;}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px;}
.imgs .im{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;aspect-ratio:4/3;cursor:pointer;}
.imgs .im img{width:100%;height:100%;object-fit:cover;display:block;}
.imgs .im .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;}
.drop{border:1px dashed #3a4050;border-radius:10px;padding:10px;text-align:center;color:var(--muted);font-size:11.5px;margin-top:8px;}
.drop.over{border-color:var(--blue);color:var(--blue);}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:200;cursor:zoom-out;}
.viewer.on{display:flex;}
.viewer img{max-width:96vw;max-height:94vh;object-fit:contain;}
.recpill{position:fixed;right:14px;bottom:14px;background:var(--red);color:#fff;border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.6);animation:pulse 1.4s infinite;display:none;font-size:12px;}
.recpill.on{display:block;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3140;color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:300;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:90vw;}
.toast.on{opacity:1;}
.ov-wrap{flex:1 1 auto;overflow:auto;padding:16px;max-width:980px;width:100%;margin:0 auto;}

@media (max-width:760px){
  body{font-size:14px;}
  header{padding:8px 12px;gap:8px;}
  header h1{font-size:15px;}
  header p,.legend{display:none;}
  .hr{width:100%;justify-content:flex-start;}
  .search{max-width:none;flex:1 1 100%;order:-1;}
  .scroller{display:none;}
  .mlist{display:block;}
  .rec-head{padding:8px 10px;gap:6px;}
  .rec-head .ttl{flex-basis:100%;order:-1;}
  .rec-head .ttl b{font-size:13px;}
  .rec-head .btn.rec{flex:1;justify-content:center;}
  .rec-head .timer{min-width:0;}
  .micst{max-width:100%;flex-basis:100%;}
  .tabbar{display:flex;}
  .pane{display:none;}
  .pane.on{display:flex;flex-basis:100%;}
  .pane.notes{border-right:0;}
  .seg{padding-right:66px;}
  .seg .ops{display:flex;}
  .modal{padding:16px;max-height:92vh;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="viewer" id="viewer" onclick="this.classList.remove('on')"><img id="viewerImg" alt=""></div>
<div class="recpill" id="recpill"></div>
<div class="toast" id="toast"></div>
<script src="data/catalog.js"></script>
<script src="data/curated.js"></script>
<script>
/* ====================================================================
   AU 2026 Schedule Notebook — single-file static app
   - Calendar (curated AI/MCP schedule + any catalog session you add)
   - Per-session record page: live bilingual transcript + notes
   - Local (no-API) summarizer, optional Claude API summarizer
   - Real-time save to localStorage/IndexedDB, optional GitHub sync
   ==================================================================== */
'use strict';
const CAT = window.__CATALOG__ || [];
const CUR = window.__CURATED__ || { S: [], DAYS: [] };
const DAYKEY = { mon: '2026-09-14', tue: '2026-09-15', wed: '2026-09-16', thu: '2026-09-17' };
const DAYS = [
  { d: '2026-09-14', en: 'Mon · Sep 14', zh: '周一 · 9/14', sub: 'AI/Developer Day (+$199)' },
  { d: '2026-09-15', en: 'Tue · Sep 15', zh: '周二 · 9/15', sub: 'Included in pass' },
  { d: '2026-09-16', en: 'Wed · Sep 16', zh: '周三 · 9/16', sub: 'Included in pass' },
  { d: '2026-09-17', en: 'Thu · Sep 17', zh: '周四 · 9/17', sub: 'Included in pass' },
];
const $ = (s, r = document) => r.querySelector(s);
const esc = (x) => String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = (min) => { const h = Math.floor(min / 60), m = min % 60, ap = h >= 12 ? 'PM' : 'AM', hr = h > 12 ? h - 12 : (h === 0 ? 12 : h); return hr + ':' + (m < 10 ? '0' : '') + m + ' ' + ap; };
const dots = (n) => '★'.repeat(n || 0);
const nid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hms = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
const isMobile = () => window.matchMedia('(max-width:760px)').matches;

/* ---------------- sessions: catalog + curated ---------------- */
const SESS = {};
for (const c of CAT) {
  const t = c.times[0] || {};
  SESS[c.code] = { code: c.code, title: c.title, type: c.type, abstract: c.abstract, speakers: c.speakers || [], date: t.date || '', s: t.s ?? 0, e: t.e ?? 0, room: t.room || '', times: c.times, topics: (c.topics || []).filter(x => x !== 'None'), level: c.level, url: c.url, pri: 3, r: null, tags: [], links: [], curated: false };
}
for (const s of CUR.S) {
  const base = SESS[s.code] || { code: s.code, title: s.en, type: (s.tags || []).some(t => t[0] === 'lab') ? 'Hands-on Lab' : 'AI/Developer Day', abstract: '', speakers: s.speakers || [], room: '', times: [], topics: [], url: '', level: '' };
  Object.assign(base, { zh: s.zh, date: DAYKEY[s.d], s: s.start, e: s.end, pri: s.pri || 3, r: s.r, tags: s.tags || [], links: s.links || [], nEn: s.nEn, nZh: s.nZh, nt: s.nt, full: !!s.full, curated: true });
  if (!base.abstract) base.abstract = s.fdesc || '';
  SESS[s.code] = base;
}
const CURATED_CODES = CUR.S.map(s => s.code);

/* ---------------- state / persistence ---------------- */
const LS_KEY = 'au26.state.v1';
const DEFAULT_REPO = 'Yushi219/AU-Schedule-Notebook';
let S = load();
function load() {

  s.removed = s.removed || {};     // code -> ts
  s.notes = s.notes || {};         // code -> note
  s.overview = s.overview || { local: '', ai: '', at: 0 };
  s.settings = Object.assign({ claudeKey: '', ghToken: '', ghRepo: DEFAULT_REPO, ghBranch: 'main', speechLang: 'en-US', lang: 'zh', translator: 'auto' }, s.settings || {});
  s.dirty = s.dirty || {};         // path -> true (needs GitHub push)
  return s;
}
let saveT = null;
function save(now) {
  const run = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { console.error(e); toast('本地存储失败: ' + e.message, 4000); } };
  if (now) { clearTimeout(saveT); run(); } else { clearTimeout(saveT); saveT = setTimeout(run, 250); }
}
window.addEventListener('beforeunload', () => save(true));
function note(code, create) {
  let n = S.notes[code];
  if (!n && create) { n = S.notes[code] = { code, transcript: [], keynotes: '', keynotesAt: 0, methods: '', methodsAt: 0, summary: { local: null, ai: '', aiAt: 0, localAt: 0 }, resources: [], images: [], updatedAt: 0, recStart: 0 }; }
  return n;
}
function touchNote(code) { const n = note(code, true); n.updatedAt = Date.now(); S.dirty['notes/' + code + '.json'] = true; save(); gh.schedule(); }

function scheduledCodes() {
  const set = new Set();
  for (const c of CURATED_CODES) if (!S.removed[c] || (S.schedule[c] && S.schedule[c].addedAt > S.removed[c])) set.add(c);
  for (const c of Object.keys(S.schedule)) if (SESS[c] && !(S.removed[c] > (S.schedule[c].addedAt || 0))) set.add(c);
  return [...set];
}
function isScheduled(code) { return scheduledCodes().includes(code); }
function addToSchedule(code) { S.schedule[code] = { addedAt: Date.now(), pri: S.schedule[code]?.pri }; delete S.removed[code]; S.dirty['notes/schedule.json'] = true; save(); gh.schedule(); }
function removeFromSchedule(code) { S.removed[code] = Date.now(); delete S.schedule[code]; S.dirty['notes/schedule.json'] = true; save(); gh.schedule(); }

/* ---------------- IndexedDB for images ---------------- */
const idb = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open('au26', 1); r.onupgradeneeded = () => r.result.createObjectStore('img', { keyPath: 'id' }); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async put(id, blob) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('img', 'readwrite'); t.objectStore('img').put({ id, blob }); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(id) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('img').objectStore('img').get(id); r.onsuccess = () => res(r.result ? r.result.blob : null); r.onerror = () => rej(r.error); }); },
  async del(id) { const db = await this.open(); return new Promise((res) => { const t = db.transaction('img', 'readwrite'); t.objectStore('img').delete(id); t.oncomplete = res; }); },
};
function shrinkImage(file, max = 1600) {
  return new Promise((res) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => { URL.revokeObjectURL(url); res({ blob: b, w: c.width, h: c.height }); }, 'image/jpeg', 0.85); };
    img.onerror = () => res({ blob: file, w: 0, h: 0 });
    img.src = url;
  });
}

/* ---------------- GitHub sync (optional) ---------------- */

    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub GET ' + r.status);
    const j = await r.json();
    if (Array.isArray(j)) return { list: j };

  async put(path, content, sha, message) {

  b64(str) { return btoa(unescape(encodeURIComponent(str))); },
  blobB64(blob) { return new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); }); },
  setStatus(st, msg) { this.status = st; this.msg = msg; document.querySelectorAll('.sync').forEach(el => { el.className = 'sync ' + st; el.textContent = msg; }); },
  schedule() { if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), S.dirty['notes/schedule.json'] ? 4000 : 12000); },
  async pullSchedule() {

    try { const r = await this.get('notes/schedule.json'); if (!r || !r.json) return false; const before = JSON.stringify([S.schedule, S.removed, S.overview.at]); mergeSchedule(r.json); const changed = before !== JSON.stringify([S.schedule, S.removed, S.overview.at]); if (changed) save(); if (!this.status || this.status === 'ok') this.setStatus('ok', '☁ 已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })); return changed; }

  // periodic pull so a change made on the other device shows up without a manual refresh

/* ---------------- translation chain ---------------- */
const tr = {
  chrome: null, chromeTried: false,
  initChrome() {
    // fire-and-forget: availability()/create() can hang or download a model for a long time;
    // the queue keeps using Google meanwhile and switches to the on-device model once it is ready
    if (this.chromeTried || !('Translator' in self)) return; this.chromeTried = true;
    (async () => { try { const av = await Translator.availability({ sourceLanguage: 'en', targetLanguage: 'zh' }); if (av !== 'unavailable') this.chrome = await Translator.create({ sourceLanguage: 'en', targetLanguage: 'zh' }); } catch (e) { console.warn('Translator API', e); this.chrome = null; } })();
  },
  async google(text, sl, tl) {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
    if (!r.ok) throw new Error('gtx ' + r.status);
    const j = await r.json(); return (j[0] || []).map(x => x[0]).join('');
  },
  async mymemory(text, sl, tl) {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`);
    const j = await r.json(); if (j.responseStatus !== 200) throw new Error('mymemory ' + j.responseStatus); return j.responseData.translatedText;
  },
  async translate(text, srcLang) {
    const en2zh = !srcLang.startsWith('zh');
    const sl = en2zh ? 'en' : 'zh-CN', tl = en2zh ? 'zh-CN' : 'en';
    const mode = S.settings.translator;
    this.initChrome();
    if (en2zh && this.chrome && (mode === 'auto' || mode === 'chrome')) { try { return await Promise.race([this.chrome.translate(text), new Promise((_, rej) => setTimeout(() => rej(new Error('chrome translate timeout')), 8000))]); } catch (e) { console.warn(e); } }
    if (mode !== 'claude') {
      try { return await this.google(text, sl, tl); } catch (e) { console.warn(e); }
      try { return await this.mymemory(text, sl, tl); } catch (e) { console.warn(e); }
    }
    if (S.settings.claudeKey) { const out = await claude([{ role: 'user', content: `Translate to ${en2zh ? 'Simplified Chinese' : 'English'}. Output only the translation, nothing else.\n\n${text}` }], { max_tokens: 1024 }); return out.trim(); }
    throw new Error('no translator');
  },
  queue: [], running: false,
  enqueue(code, seg) { if (!seg.tr && !this.queue.some(q => q.seg.id === seg.id)) { this.queue.push({ code, seg }); this.run(); } },
  async run() {
    if (this.running) return; this.running = true;
    while (this.queue.length) {
      const { code, seg } = this.queue.shift();
      try { seg.tr = await this.translate(seg.t, seg.lang || 'en-US'); seg.trErr = 0; touchNote(code); if (UI.route === 'rec' && UI.code === code) updateSeg(seg); }
      catch (e) { seg.trErr = (seg.trErr || 0) + 1; console.warn('translate fail', e); if (UI.route === 'rec' && UI.code === code) updateSeg(seg); }
      await new Promise(r => setTimeout(r, 150));
    }
    this.running = false;
  },
  retryMissing(code) { const n = S.notes[code]; if (!n) return; for (const s of n.transcript) if (!s.tr && s.t) { s.trErr = 0; this.enqueue(code, s); } },
};
setInterval(() => { if (UI.route === 'rec' && UI.code && navigator.onLine) { const n = S.notes[UI.code]; if (n) for (const s of n.transcript) if (!s.tr && (s.trErr || 0) < 4) tr.enqueue(UI.code, s); } }, 20000);

/* ---------------- speech engine (Web Speech API) ---------------- */
const speech = {
  rec: null, running: false, code: null, startedAt: 0, interim: '', wake: null, restartT: null, supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition), lastResultAt: 0,
  lastErr: '', lastErrAt: 0, stream: null, actx: null, meterRaf: 0, watchT: null, peak: 0, lastLoudAt: 0,
  async start(code) {
    if (!this.supported) { toast('此浏览器不支持语音识别，请用 Chrome / Safari', 4000); return; }
    if (this.running && this.code === code) return;
    if (this.running) this.stop();
    this.code = code; this.running = true; this.startedAt = Date.now();
    const n = note(code, true); if (!n.recStart) n.recStart = Date.now(); touchNote(code);
    try { if (navigator.wakeLock) this.wake = await navigator.wakeLock.request('screen'); } catch (e) { }
    tr.initChrome();
    this.lastErr = ''; this.lastErrAt = 0; this.lastResultAt = Date.now(); this.lastLoudAt = Date.now(); this.peak = 0;
    this.spawn();
    this.openMeter();
    clearInterval(this.watchT); this.watchT = setInterval(() => this.watch(), 1000);
    renderRecPill(); this.showStatus();
  },
  /* microphone level meter — proves whether the mic hears anything at all */
  async openMeter() {
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const AC = window.AudioContext || window.webkitAudioContext; this.actx = new AC();
      const src = this.actx.createMediaStreamSource(this.stream); const an = this.actx.createAnalyser(); an.fftSize = 512; src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      const tick = () => {
        if (!this.running) return;
        an.getByteTimeDomainData(buf); let sum = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / buf.length); const lvl = Math.min(1, rms * 6); this.peak = Math.max(this.peak * 0.92, lvl);
        if (lvl > 0.06) this.lastLoudAt = Date.now();
        const b = $('#miclvl'); if (b) b.style.width = Math.round(this.peak * 100) + '%';
        this.meterRaf = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) { console.warn('meter', e); this.lastErr = 'meter:' + (e.name || e); this.lastErrAt = Date.now(); this.showStatus(); }
  },
  closeMeter() {
    cancelAnimationFrame(this.meterRaf); this.meterRaf = 0;
    if (this.stream) { try { this.stream.getTracks().forEach(t => t.stop()); } catch (e) { } this.stream = null; }
    if (this.actx) { try { this.actx.close(); } catch (e) { } this.actx = null; }
    const b = $('#miclvl'); if (b) b.style.width = '0';
  },
  watch() { if (this.running) this.showStatus(); },
  /* one-line diagnosis next to the record button */
  showStatus() {
    const el = $('#micst'), msg = $('#micmsg'); if (!el || !msg) return;
    const on = this.running && this.code === UI.code, err = this.lastErr;
    const sticky = !on && this.code === UI.code && (err === 'not-allowed' || err === 'service-not-allowed' || err.startsWith('meter:'));
    el.classList.toggle('on', on || sticky); if (!on && !sticky) return;
    if (sticky) { el.className = 'micst on err'; msg.textContent = T('Mic permission denied — allow it via the lock icon in the address bar', '麦克风权限被拒绝，点地址栏锁图标允许后重试'); return; }
    const now = Date.now(), quietFor = Math.round((now - this.lastLoudAt) / 1000), noResFor = Math.round((now - this.lastResultAt) / 1000);
    let cls = '', text = '';
    const errAge = (now - this.lastErrAt) / 1000;
    if (err.startsWith('meter:')) { cls = 'err'; text = T('Mic unavailable', '拿不到麦克风') + ' (' + err.slice(6) + ')'; }
    else if (err === 'network' && errAge < 20) { cls = 'err'; text = T('Speech server unreachable (Google)', '连不上语音服务器 (Google)，识别不了'); }
    else if (err === 'audio-capture' && errAge < 20) { cls = 'err'; text = T('No microphone found', '找不到麦克风设备'); }
    else if (err === 'not-allowed' || err === 'service-not-allowed') { cls = 'err'; text = T('Mic permission denied', '麦克风权限被拒绝'); }
    else if (quietFor >= 8) { cls = 'warn'; text = T('Mic hears silence', '麦克风没听到声音') + ' ' + quietFor + 's'; }
    else if (noResFor >= 30) { cls = 'warn'; text = T('Sound but no recognition', '有声音但没识别出文字') + ' ' + noResFor + 's' + (err ? ' · ' + err : ''); }
    else if (this.lastResultAt > this.startedAt) { text = T('Recognizing', '识别中'); }
    else { text = T('Listening…', '正在听…'); }
    el.className = 'micst on ' + cls; msg.textContent = text;
  },
  spawn() {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = this.rec = new R();
    r.continuous = true; r.interimResults = true; r.lang = S.settings.speechLang; r.maxAlternatives = 1;
    r.onresult = (e) => {
      let interim = '';

        const res = e.results[i]; const text = (res[0].transcript || '').trim(); if (!text) continue;
        if (res.isFinal) this.commit(text); else interim += text + ' ';
      }
      this.interim = interim; this.lastResultAt = Date.now(); this.showStatus();
      const el = $('#interim'); if (el) el.textContent = interim;
    };
    r.onerror = (e) => { console.warn('speech error', e.error); if (e.error !== 'aborted') { this.lastErr = e.error; this.lastErrAt = Date.now(); } if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { toast('麦克风权限被拒绝', 4000); this.stop(); } else this.showStatus(); };

    try { r.start(); } catch (e) { console.warn(e); }

/* ---------------- Claude API (optional, direct from browser) ---------------- */
async function claude(messages, { system, max_tokens = 8000, onDelta } = {}) {
  const key = S.settings.claudeKey; if (!key) throw new Error('未设置 Claude API key（右上角 ⚙ 设置）');
  const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true', 'anthropic-beta': 'server-side-fallback-2026-07-01' };
  const body = { model: 'claude-opus-5', max_tokens, messages, stream: !!onDelta, fallbacks: 'default' };
  if (system) body.system = system;
  let r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers, body: JSON.stringify(body) });
  if (r.status === 400) { // retry without the fallback beta in case it is not accepted
    delete headers['anthropic-beta']; delete body.fallbacks;
    r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers, body: JSON.stringify(body) });
  }
  if (!r.ok) { const t = await r.text(); throw new Error('Claude API ' + r.status + ': ' + t.slice(0, 200)); }
  if (!onDelta) { const j = await r.json(); if (j.stop_reason === 'refusal') throw new Error('Claude 拒绝了该请求'); return j.content.filter(b => b.type === 'text').map(b => b.text).join(''); }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '', out = '';
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const ln of lines) {
      if (!ln.startsWith('data:')) continue;
      try { const ev = JSON.parse(ln.slice(5).trim()); if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { out += ev.delta.text; onDelta(out); } if (ev.type === 'error') throw new Error(ev.error && ev.error.message); } catch (e) { if (e instanceof SyntaxError) continue; throw e; }
    }
  }
  return out;
}

function summarizeLocal(n) {

/* search */
function setupSearch() {
  const q = $('#q'), dd = $('#dd'); let sel = 0, res = [];
  const run = () => {
    const v = q.value.trim().toLowerCase(); if (!v) { dd.classList.remove('on'); return; }
    const words = v.split(/\s+/);
    res = CAT.concat(CUR.S.filter(s => !CAT.some(c => c.code === s.code)).map(s => ({ code: s.code, title: s.en, speakers: s.speakers || [], times: [], _cur: true }))).map(c => {
      const hay = (c.code + ' ' + c.title + ' ' + (c.speakers || []).join(' ')).toLowerCase(); let sc = 0;
      for (const w of words) { if (!hay.includes(w)) return null; sc += c.code.toLowerCase().startsWith(w) ? 10 : c.title.toLowerCase().includes(w) ? 3 : 1; }
      if (c.code.toLowerCase() === v) sc += 50; return { c, sc };
    }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 14).map(x => x.c);
    sel = 0; draw();
  };
  const draw = () => {
    if (!res.length) { dd.innerHTML = `<div class="it muted">${T('No match', '没有匹配')}</div>`; dd.classList.add('on'); return; }
    dd.innerHTML = res.map((c, i) => { const s = SESS[c.code]; const t = s && s.date ? `${T(dayName(s.date), dayName(s.date, true))} ${fmt(s.s)}–${fmt(s.e)}${s.room ? ' · ' + esc(s.room.replace('Venetian, ', '')) : ''}` : ''; return `<div class="it ${i === sel ? 'sel' : ''}" data-i="${i}"><div class="c">${esc(c.code)}</div><div style="flex:1;min-width:0"><div class="t">${esc(c.title)}</div><div class="m">${t}${c.type ? ' · ' + esc(c.type) : ''}${(c.speakers || []).length ? ' · ' + esc(c.speakers[0].split(',')[0]) : ''}</div></div>${isScheduled(c.code) ? `<span class="in">✓ ${T('in schedule', '已在日程')}</span>` : ''}</div>`; }).join('');
    dd.classList.add('on');
    dd.querySelectorAll('.it[data-i]').forEach(el => { el.onmousedown = (e) => { e.preventDefault(); choose(+el.dataset.i); }; });
  };
  const choose = (i) => { const c = res[i]; if (!c) return; if (!isScheduled(c.code)) { addToSchedule(c.code); toast(`✓ ${c.code} ${T('added to schedule', '已加入日程')}`); renderGrid(); renderMobileList(); } q.value = ''; dd.classList.remove('on'); openModal(c.code); };
  q.oninput = run; q.onfocus = () => { if (q.value.trim()) run(); }; q.onblur = () => setTimeout(() => dd.classList.remove('on'), 150);
  q.onkeydown = (e) => { if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, res.length - 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); } else if (e.key === 'Enter') { choose(sel); } else if (e.key === 'Escape') { dd.classList.remove('on'); q.blur(); } };
}

function starSeg(id) { const n = S.notes[UI.code]; const sg = n.transcript.find(x => x.id === id); if (!sg) return; sg.star = !sg.star; touchNote(UI.code); updateSeg(sg); }
function delSeg(id) { const n = S.notes[UI.code]; const i = n.transcript.findIndex(x => x.id === id); if (i < 0) return; n.transcript.splice(i, 1); touchNote(UI.code); const d = document.getElementById('seg_' + id); if (d) d.remove(); }
function addManual(code) { const inp = $('#manual'); const t = inp.value.trim(); if (!t) return; const n = note(code, true); const seg = { id: nid('m'), ts: Date.now(), at: n.recStart ? Math.round((Date.now() - n.recStart) / 1000) : 0, t, tr: '', lang: /[一-鿿]/.test(t) ? 'zh-CN' : 'en-US', manual: true }; n.transcript.push(seg); touchNote(code); appendSeg(seg); tr.enqueue(code, seg); inp.value = ''; }
function copyTranscript(code) { navigator.clipboard.writeText(transcriptText(S.notes[code])).then(() => toast('已复制转写')); }
function renderNotes() {
  const code = UI.code, n = S.notes[code]; const el = $('#notesBody'); if (!el) return;
  const sm = n.summary.local;
  const li = (x) => `<div class="li"><div class="en">${esc(x.t)}</div>${x.tr ? `<div class="zh">${esc(x.tr)}</div>` : ''}</div>`;
  el.innerHTML = `
  <div class="card"><h3>✍️ Keynotes <span class="muted" style="font-weight:400">${T('(your own notes, auto-saved)', '（自己的笔记，自动保存）')}</span></h3><textarea id="kn" rows="7" placeholder="${T('Key points, quotes, numbers…', '要点、金句、数字……支持 Markdown 列表')}">${esc(n.keynotes)}</textarea></div>
  <div class="card"><h3>🧭 ${T('Methodology', '方法论')}</h3><textarea id="mt" rows="4" placeholder="${T('Approaches / steps / patterns the speaker used', '讲者用的方法、步骤、架构模式')}">${esc(n.methods)}</textarea></div>
  <div class="card summ"><h3>⚡ ${T('Auto summary (local, no API)', '自动总结（本地，无需 API）')}<span class="sp"></span>${sm ? `<span class="muted" style="font-weight:400">${sm.n} ${T('segs', '段')} · ${new Date(sm.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</span><button class="btn sm" onclick="appendSummaryToNotes('${code}')">${T('Append to Keynotes', '追加到 Keynotes')}</button>` : ''}</h3>
    ${sm ? `<div class="kw">${sm.keywords.map(k => `<span>${esc(k)}</span>`).join('')}</div><h4>Key points</h4>${sm.keynotes.map(li).join('')}${sm.methods.length ? '<h4>Methodology cues</h4>' + sm.methods.map(li).join('') : ''}${sm.actions.length ? '<h4>Follow-ups / resources mentioned</h4>' + sm.actions.map(li).join('') : ''}` : `<div class="muted">${T('Click "Local summary" after some transcript has accumulated. Starred (★) segments get priority.', '转写积累一些后点上方"本地总结"。标了 ★ 的段落会优先进入总结。')}</div>`}</div>
  <div class="card"><h3>✨ Claude ${T('summary', '总结')}<span class="sp"></span>${n.summary.ai ? `<span class="muted" style="font-weight:400">${new Date(n.summary.aiAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</span><button class="btn sm" onclick="navigator.clipboard.writeText(S.notes['${code}'].summary.ai).then(()=>toast('已复制'))">📋</button>` : ''}</h3><div class="md" id="aisum">${n.summary.ai ? md2html(n.summary.ai) : `<span class="muted">${S.settings.claudeKey ? T('Click "Claude summary" above.', '点上方 "Claude 总结"。') : T('Add a Claude API key in ⚙ settings to enable.', '在 ⚙ 设置里填 Claude API key 后可用。')}</span>`}</div></div>
  <div class="card"><h3>🔗 ${T('Resources', '资源链接')}</h3><div style="display:flex;gap:6px"><input id="resurl" placeholder="https://… ${T('paste a link, Enter', '粘贴链接，回车')}" style="flex:1" onkeydown="if(event.key==='Enter')addRes('${code}')"><button class="btn sm" onclick="addRes('${code}')">＋</button></div><div id="reslist">${n.resources.map(r => `<div class="res"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title || r.url)}</a><input value="${esc(r.title || '')}" placeholder="${T('title/note', '标题/备注')}" onchange="resTitle('${code}','${r.id}',this.value)"><button class="btn sm" onclick="delRes('${code}','${r.id}')">✕</button></div>`).join('')}</div></div>
  <div class="card"><h3>🖼 ${T('Screenshots', '截图')}<span class="sp"></span><label class="btn sm">📷 ${T('Add', '添加')}<input type="file" accept="image/*" multiple style="display:none" onchange="addImages('${code}',this.files)"></label></h3>
    <div class="drop" id="drop">${T('Paste (Ctrl+V) or drop images anywhere on this panel', '在这个面板里 Ctrl+V 粘贴截图，或把图片拖进来')}</div><div class="imgs" id="imgs"></div></div>`;
  const kn = $('#kn'), mt = $('#mt');
  kn.oninput = () => { n.keynotes = kn.value; n.keynotesAt = Date.now(); touchNote(code); };
  mt.oninput = () => { n.methods = mt.value; n.methodsAt = Date.now(); touchNote(code); };
  const pane = $('#notesPane');
  pane.ondragover = (e) => { e.preventDefault(); $('#drop').classList.add('over'); }; pane.ondragleave = () => $('#drop').classList.remove('over');
  pane.ondrop = (e) => { e.preventDefault(); $('#drop').classList.remove('over'); const fs = [...(e.dataTransfer.files || [])].filter(f => f.type.startsWith('image/')); if (fs.length) addImages(code, fs); const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain'); if (url && /^https?:\/\//.test(url.trim()) && !fs.length) { $('#resurl').value = url.trim(); addRes(code); } };
  renderImages();
}
document.addEventListener('paste', (e) => {
  if (UI.route !== 'rec') return; const items = [...(e.clipboardData.items || [])]; const fs = items.filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if (fs.length) { e.preventDefault(); addImages(UI.code, fs); return; }
  const t = e.clipboardData.getData('text'); if (t && /^https?:\/\/\S+$/.test(t.trim()) && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.id !== 'manual') { e.preventDefault(); const n = note(UI.code, true); if (!n.resources.some(r => r.url === t.trim())) { n.resources.push({ id: nid('r'), url: t.trim(), title: '', ts: Date.now() }); touchNote(UI.code); renderNotes(); toast('已添加链接'); } }
});
function addRes(code) { const inp = $('#resurl'); const u = inp.value.trim(); if (!u) return; const n = note(code, true); n.resources.push({ id: nid('r'), url: /^https?:/.test(u) ? u : 'https://' + u, title: '', ts: Date.now() }); touchNote(code); inp.value = ''; renderNotes(); }
function resTitle(code, id, v) { const r = S.notes[code].resources.find(x => x.id === id); if (r) { r.title = v; r.ts = Date.now(); touchNote(code); } }
function delRes(code, id) { const n = S.notes[code]; n.resources = n.resources.filter(x => x.id !== id); (n.deleted = n.deleted || []).push(id); touchNote(code); renderNotes(); }
async function addImages(code, files) {
  const n = note(code, true);
  for (const f of files) { const { blob, w, h } = await shrinkImage(f); const id = nid('i'); await idb.put(id, blob); n.images.push({ id, name: f.name || 'paste', ts: Date.now(), w, h, gh: false }); }
  touchNote(code); renderImages(); toast(`+${files.length} 张截图`);
}
async function renderImages() {
  const n = S.notes[UI.code]; const el = $('#imgs'); if (!el) return; el.innerHTML = '';
  for (const im of n.images) {
    const d = document.createElement('div'); d.className = 'im'; const img = document.createElement('img');
    const blob = await idb.get(im.id); img.src = blob ? URL.createObjectURL(blob) : (gh.on() ? gh.imgUrl(im.id) : ''); img.alt = im.name;
    d.appendChild(img); const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.onclick = (e) => { e.stopPropagation(); delImage(UI.code, im.id); }; d.appendChild(x);
    d.onclick = () => { $('#viewerImg').src = img.src; $('#viewer').classList.add('on'); }; el.appendChild(d);
  }
}
async function delImage(code, id) { const n = S.notes[code]; n.images = n.images.filter(x => x.id !== id); (n.deleted = n.deleted || []).push(id); await idb.del(id); touchNote(code); renderImages(); }
function doLocalSummary(code) { const n = S.notes[code]; const sm = summarizeLocal(n); if (!sm) { toast(T('Not enough transcript yet', '转写还太少')); return; } n.summary.local = sm; n.summary.localAt = Date.now(); touchNote(code); if (isMobile()) UI.tab = 'notes'; renderRec(); toast('⚡ ' + T('Local summary updated', '本地总结已更新')); }
function appendSummaryToNotes(code) { const n = S.notes[code]; const sm = n.summary.local; if (!sm) return; const txt = '\n' + sm.keynotes.map(k => '- ' + k.t + (k.tr ? '\n  ' + k.tr : '')).join('\n'); n.keynotes = (n.keynotes ? n.keynotes.trimEnd() + '\n' : '') + txt.trim() + '\n'; n.keynotesAt = Date.now(); if (sm.methods.length) { n.methods = (n.methods ? n.methods.trimEnd() + '\n' : '') + sm.methods.map(k => '- ' + k.t).join('\n') + '\n'; n.methodsAt = Date.now(); } touchNote(code); renderNotes(); toast('已追加'); }
async function doAISummary(code) {
  if (!S.settings.claudeKey) { openSettings(); return; } const n = S.notes[code]; if (!n.transcript.length && !n.keynotes) { toast('还没有转写'); return; }
  if (isMobile()) { UI.tab = 'notes'; renderRec(); }
  const el = $('#aisum'); el.innerHTML = '<span class="muted">✨ Claude 正在总结…</span>';
  try { const out = await summarizeAI(code, (t) => { el.innerHTML = md2html(t); }); n.summary.ai = out; n.summary.aiAt = Date.now(); touchNote(code); renderNotes(); toast('✨ Claude 总结完成'); }
  catch (e) { el.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
}
function exportNote(code) {
  const s = SESS[code], n = S.notes[code]; const sm = n.summary.local;
  const md = [`# ${s.code} · ${s.title}`, s.zh ? s.zh : '', `${s.date || ''} ${fmt(s.s)}–${fmt(s.e)} · ${s.room}`, `讲者：${s.speakers.join('；')}`, '', '## Keynotes', n.keynotes || '—', '', '## Methodology', n.methods || '—', '',
    sm ? '## Auto summary\n关键词：' + sm.keywords.join(', ') + '\n' + sm.keynotes.map(k => '- ' + k.t + (k.tr ? '\n  - ' + k.tr : '')).join('\n') + (sm.methods.length ? '\n\n### Methodology cues\n' + sm.methods.map(k => '- ' + k.t).join('\n') : '') : '',
    n.summary.ai ? '\n## Claude summary\n' + n.summary.ai : '', '', '## Resources', n.resources.map(r => `- ${r.title ? r.title + ' — ' : ''}${r.url}`).join('\n') || '—', '', '## Screenshots', n.images.map(i => `- notes/img/${i.id}.jpg`).join('\n') || '—', '', '## Transcript', transcriptText(n)].join('\n');
  dl(new Blob([md], { type: 'text/markdown' }), `${s.code}.md`);
}

/* ---------------- overview ---------------- */
function renderOverview() {
  const app = $('#app'); const o = S.overview;
  app.innerHTML = `<div class="rec"><div class="rec-head"><button class="btn sm" onclick="nav('#/')">← ${T('Calendar', '日历')}</button><div class="ttl"><b>🧭 ${T('Cross-course overview', '横向总览总结')}</b><span>${T('Combines notes from every recorded session', '把所有有记录的课程横向结合起来')}</span></div>
    <button class="btn" onclick="doOverviewLocal()">⚡ ${T('Generate (local)', '本地生成')}</button><button class="btn primary" onclick="doOverviewAI()">✨ Claude ${T('synthesis', '整合')}</button><button class="btn sm" onclick="dl(new Blob([S.overview.ai||S.overview.local||''],{type:'text/markdown'}),'AU2026-overview.md')">⬇ .md</button><span class="sync ${gh.status}">${gh.on() ? (gh.msg || '☁') : ''}</span></div>
    <div class="ov-wrap"><div class="card"><h3>⚡ ${T('Local overview', '本地总览')}<span class="sp"></span><span class="muted" style="font-weight:400">${o.at ? new Date(o.at).toLocaleString('zh-CN') : ''}</span></h3><div class="md" id="ovlocal">${o.local ? md2html(o.local) : `<span class="muted">${T('Click "Generate (local)".', '点"本地生成"。')}</span>`}</div></div>
    <div class="card"><h3>✨ Claude ${T('synthesis', '整合')}</h3><div class="md" id="ovai">${o.ai ? md2html(o.ai) : `<span class="muted">${S.settings.claudeKey ? T('Click "Claude synthesis".', '点"Claude 整合"。') : T('Needs a Claude API key (⚙).', '需要在 ⚙ 里填 Claude API key。')}</span>`}</div></div></div></div>`;
}
function doOverviewLocal() { S.overview.local = overviewLocal(); S.overview.at = Date.now(); S.dirty['notes/schedule.json'] = true; save(); gh.schedule(); renderOverview(); }
async function doOverviewAI() { if (!S.settings.claudeKey) { openSettings(); return; } const el = $('#ovai'); el.innerHTML = '<span class="muted">✨ Claude 正在整合所有课程…</span>'; try { const out = await overviewAI((t) => { el.innerHTML = md2html(t); }); S.overview.ai = out; S.overview.at = Date.now(); S.dirty['notes/schedule.json'] = true; save(); gh.schedule(); renderOverview(); toast('✨ 完成'); } catch (e) { el.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; } }

/* ---------------- boot ---------------- */
route();
if (gh.on()) gh.pullAll().then(ch => { if (UI.route !== 'rec') route(); });
</script>
</body>
</html>
